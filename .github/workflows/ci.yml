name: React CI/CD pipeline

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'
      - name: Install dependecies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run Type Checks
        run: npm run type-check
